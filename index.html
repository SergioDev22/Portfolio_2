    <script>
      // Applique le thème avant le rendu pour éviter un flash de thème clair
      (function () {
        var saved = null;
        try {
          saved = localStorage.getItem("theme");
        } catch (e) {
          /* localStorage indisponible */
        }
        if (saved !== "light") {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
